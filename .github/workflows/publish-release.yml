name: Publish release from build artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID containing tally-0.14.0-apk
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name tally-0.14.0-apk \
            --dir apk
          test -f apk/tally-0.14.0.apk

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.14.0 \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Tally v0.14.0" \
            --notes-file .github/release-notes/v0.14.0.md \
            apk/tally-0.14.0.apk
